<!-- one label + input + errors; cols can be overridden per include -->
<div class="{{ cols|default:'col-md-6' }} mb-2">
    <label class="mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
