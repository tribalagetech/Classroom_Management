<!-- teachers/templates/teachers/register.html -->
{% extends 'base.html' %}
{% block title %}Register Teacher{% endblock %}

{% block content %}
<div class="card mt-4 mb-4">
    <div class="card-header"><h4 class="mb-0">Register Teacher</h4></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <!-- loop over every form field: label, input, and its own error messages -->
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-2">
                    <label for="{{ field.id_for_label }}" class="mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary mt-2">Save Teacher</button>
            <a href="{% url 'teachers:list' %}" class="btn btn-outline-light mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
