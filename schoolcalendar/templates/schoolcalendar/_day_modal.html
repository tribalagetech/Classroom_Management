{{ day_data|json_script:"day-data" }}   {# hands every day's details to the JavaScript #}

<div class="modal fade" id="dayModal" tabindex="-1" aria-labelledby="dayTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="dayTitle"></h5>
          <div class="small text-muted" id="dayMeta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div id="dayEvents"></div>

        {% if can_add_event %}
          <hr class="my-3">
          <form id="dayForm" novalidate data-url="{% url 'schoolcalendar:event_quick_add' %}">
            {% csrf_token %}
            <h6 class="mb-2">Add an event on this day</h6>
            <div id="dayAlert" class="alert alert-danger py-2 d-none"></div>

            <div class="row g-2">
              <div class="col-12">
                <input type="text" name="title" class="form-control" placeholder="Event title" maxlength="150">
                <div class="text-danger small" data-err="title"></div>
              </div>
              <div class="col-7">
                <label class="small mb-1" for="dayType">Type</label>
                <select name="event_type" id="dayType" class="form-select">
                  {% for value, label in event_types %}
                    <option value="{{ value }}"{% if value == 'SCHOOL_EVENT' %} selected{% endif %}>{{ label }}</option>
                  {% endfor %}
                </select>
                <div class="text-danger small" data-err="event_type"></div>
              </div>
              <div class="col-5">
                <label class="small mb-1" for="dayEnd">Ends (optional)</label>
                <input type="date" name="end_date" id="dayEnd" class="form-control">
                <div class="text-danger small" data-err="end_date"></div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="confirmed" id="dayConfirmed" checked>
                  <label class="form-check-label" for="dayConfirmed">This date is confirmed</label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-sm mt-3" id="daySave">Add event</button>
          </form>
        {% endif %}
      </div>

    </div>
  </div>
</div>
