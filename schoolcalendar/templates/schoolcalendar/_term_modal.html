<!-- The pop-up. It only exists on the page for people allowed to change terms. -->
{{ terms_data|json_script:"terms-data" }} {# hands the saved terms to the JavaScript #}

<div class="modal fade" id="termModal" tabindex="-1" aria-labelledby="termModalLabel" aria-hidden="true" data-year="{{ year }}">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="termModalLabel">Custom school calendar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="termForm" novalidate data-url="{% url 'schoolcalendar:term_save' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div id="termAlert" class="alert alert-danger py-2 d-none"></div>

                    <div class="row g-3">

                        <!-- LEFT: the form -->
                        <div class="col-md-7">

                            <div class="row g-2">
                                <div class="col-7">
                                    <label class="mb-1" for="tmNumber">1. Select term</label>
                                    <select class="form-select" id="tmNumber">
                                        <option value="">Select a term...</option>
                                        <option value="1">Term 1</option>
                                        <option value="2">Term 2</option>
                                        <option value="3">Term 3</option>
                                        <option value="4">Term 4</option>
                                    </select>
                                    <div class="text-danger small" data-err="number"></div>
                                </div>
                                <div class="col-5">
                                    <label class="mb-1" for="tmWeeks">2. Number of weeks</label>
                                    <input type="number" class="form-control" id="tmWeeks" min="1" max="20"
                                        placeholder="e.g. 10">
                                    <div class="text-danger small" data-err="weeks"></div>
                                </div>
                            </div>
                            <div class="small text-info mt-1" id="tmExisting"></div>

                            <div class="mt-3">
                                <label class="mb-1" for="tmStart">3. Term start date <span
                                        class="text-muted small">(school starts on Term 1's start)</span></label>
                                <div class="date-field position-relative">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="tmStart" placeholder="DD-MM-YYYY"
                                            inputmode="numeric" autocomplete="off">
                                        <button class="btn btn-outline-light" type="button"
                                            aria-label="Pick a date">📅</button>
                                    </div>
                                    <input type="date" class="date-native" tabindex="-1" aria-hidden="true">
                                </div>
                                <div class="small text-muted" id="tmStartName"></div>
                                <div class="text-danger small" data-err="start_date"></div>
                            </div>

                            <div class="mt-2">
                                <label class="mb-1" for="tmEnd">Term end date <span class="text-muted small">(school
                                        ends on Term 4's end)</span></label>
                                <div class="date-field position-relative">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="tmEnd" placeholder="DD-MM-YYYY"
                                            inputmode="numeric" autocomplete="off">
                                        <button class="btn btn-outline-light" type="button"
                                            aria-label="Pick a date">📅</button>
                                    </div>
                                    <input type="date" class="date-native" tabindex="-1" aria-hidden="true">
                                </div>
                                <div class="small text-muted" id="tmEndName"></div>
                                <div class="text-danger small" data-err="end_date"></div>
                            </div>

                            <div class="term-summary small mt-2" id="tmSummary"></div>

                            <div class="mt-3">
                                <label class="mb-1" for="tmBreak">4. Holiday after this term</label>
                                <select class="form-select" id="tmBreak">
                                    <option value="">Not set yet</option>
                                    <option value="ONE">1 week term break</option>
                                    <option value="TWO">2 weeks term break</option>
                                    <option value="XMAS">Christmas holiday (calculated)</option>
                                </select>
                                <div class="small text-info mt-1" id="tmBreakNote"></div>
                                <div class="text-danger small" data-err="break_after"></div>
                            </div>

                            <div class="mt-3">
                                <label class="mb-1" for="tmInfo">5. Information to staff <span
                                        class="text-muted small">(optional)</span></label>
                                <textarea class="form-control" id="tmInfo" rows="3" maxlength="2000"
                                    placeholder="e.g. Staff return Monday 18 January for planning days."></textarea>
                                <div class="text-danger small" data-err="staff_info"></div>
                            </div>

                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="tmConfirmed" checked>
                                <label class="form-check-label" for="tmConfirmed">These dates are confirmed</label>
                            </div>
                        </div>

                        <!-- RIGHT: helper calendar -->
                        <div class="col-md-5">
                            <div class="mini-cal">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <button type="button" class="btn btn-outline-light btn-sm py-0" id="mcPrev"
                                        aria-label="Previous month">‹</button>
                                    <strong class="small" id="mcTitle"></strong>
                                    <button type="button" class="btn btn-outline-light btn-sm py-0" id="mcNext"
                                        aria-label="Next month">›</button>
                                </div>
                                <div class="mc-head">
                                    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                                </div>
                                <div class="mc-grid" id="mcGrid"></div>
                                <div class="btn-group btn-group-sm w-100 mt-2" role="group"
                                    aria-label="What a click sets">
                                    <button type="button" class="btn btn-outline-light active" data-pick="start">Click
                                        sets start</button>
                                    <button type="button" class="btn btn-outline-light" data-pick="end">Click sets
                                        end</button>
                                </div>
                                <div class="small text-muted mt-2">
                                    <span class="mc-key mc-range"></span> this term &nbsp;
                                    <span class="mc-key mc-other"></span> other terms
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="tmSave">Save term</button>
                </div>
            </form>

        </div>
    </div>
</div>
